name: Apply Royal Rumble V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/royal-rumble-v2/**'
      - '.github/workflows/royal-rumble-v2-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply Royal Rumble V2 and shirt assembly assets
        run: |
          node tools/royal-rumble-v2/apply-v2.mjs .
          node tools/royal-rumble-v2/finalize-kits.mjs
          sed -i "s/as KitAssemblySeason\[\]/as unknown as KitAssemblySeason[]/" lib/kit/assembly.ts
          node <<'NODE'
          const fs = require('fs')

          const designsPath = 'content/manual/kit-designs.json'
          const designs = JSON.parse(fs.readFileSync(designsPath, 'utf8'))
          designs.records = (designs.records || []).filter((row) => !['1985/86','2009/10'].includes(row.seasonLabel))
          fs.writeFileSync(designsPath, JSON.stringify(designs, null, 2) + '\n')

          const provenancePath = 'content/manual/asset-provenance.json'
          const provenance = JSON.parse(fs.readFileSync(provenancePath, 'utf8'))
          const record = (provenance.records || []).find((row) => row.key === 'kit-assembly-maor-2026-09-20')
          if (record) record.origin = 'archive-scan'
          fs.writeFileSync(provenancePath, JSON.stringify(provenance, null, 1) + '\n')

          const specialBlock = `  const specialSeason = (() => {\n    const start = player.fromYear ?? player.toYear\n    const end = player.toYear ?? player.fromYear\n    if (start === null || start === undefined || end === null || end === undefined) return null\n    if (start <= 1985 && end >= 1985) return { season: '1985/86', src: '/kits/assembly/1985-86/home-master.svg' }\n    if (start <= 2009 && end >= 2009) return { season: '2009/10', src: '/kits/assembly/2009-10/home-master-a.svg' }\n    return null\n  })()\n  if (specialSeason) {\n    return (\n      <div className=\"relative\">\n        <img src={specialSeason.src} alt={t('kitSeason', { season: specialSeason.season })} className={className} />\n        <p className=\"mt-1 text-center font-mono tabular-nums text-[7px] font-black tracking-[0.12em] text-concrete\" dir=\"ltr\">{specialSeason.season}</p>\n      </div>\n    )\n  }\n`

          for (const file of ['app/royal-rumble/RoyalRumbleRun.tsx','app/royal-rumble/RoyalRumbleLiveRun.tsx']) {
            let text = fs.readFileSync(file, 'utf8')
            const anchor = '  const kit = kitForPlayer(player, kits)\n'
            if (!text.includes(anchor)) throw new Error(`shirt anchor missing in ${file}`)
            text = text.replace(anchor, specialBlock + anchor)
            if (file.endsWith('RoyalRumbleLiveRun.tsx')) {
              text = text.replace('className={className}', 'className="h-[106px] w-[96px]"')
              text = text.replaceAll('font-mono ', 'font-mono tabular-nums ')
            }
            fs.writeFileSync(file, text)
          }
          NODE
          rm -rf tools/royal-rumble-v2 .github/workflows/royal-rumble-v2-apply.yml

      - name: Install
        run: npm ci

      - name: Repository hygiene
        run: npm run repo:hygiene

      - name: Asset provenance
        run: npm run assets:provenance

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Royal Rumble V2: live H2H and historical shirt assembly"
          git push origin HEAD:main
