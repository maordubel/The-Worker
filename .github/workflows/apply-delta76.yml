name: Apply Delta76 Reconcile

on:
  push:
    branches:
      - feature/gate-9-royal-rumble
    paths:
      - .patch-reconcile/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-9-royal-rumble
          fetch-depth: 0

      - name: Apply reconciled delta
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .patch-reconcile/READY ]; then
            echo "Nothing to apply."
            exit 0
          fi

          cat .patch-reconcile/delta76.* > /tmp/delta76.patch.gz.b64
          test "$(wc -c < /tmp/delta76.patch.gz.b64)" -eq 226840
          base64 -d /tmp/delta76.patch.gz.b64 | gunzip > /tmp/delta76.patch

          # These three legacy source files are byte-identical to the patch base except
          # for CRLF line endings. Normalize them before applying the LF git patch.
          sed -i 's/\r$//' components/play/Burst.tsx
          sed -i 's/\r$//' components/play/Confetti.tsx
          sed -i 's/\r$//' components/press/PlayerFigure.tsx

          git apply --check /tmp/delta76.patch
          git apply /tmp/delta76.patch

          python - <<'PY'
          from pathlib import Path

          p = Path('app/royal-rumble/RoyalRumbleMatchFX.tsx')
          if p.exists():
              s = p.read_text()
              old = 'const building = /מסירה|מתקדם|מצב|בעיטה|נפתח|לוחץ|היציע כבר עומד/.test(commentary)'
              new = r'const building = /\u05de\u05e1\u05d9\u05e8\u05d4|\u05de\u05ea\u05e7\u05d3\u05dd|\u05de\u05e6\u05d1|\u05d1\u05e2\u05d9\u05d8\u05d4|\u05e0\u05e4\u05ea\u05d7|\u05dc\u05d5\u05d7\u05e5|\u05d4\u05d9\u05e6\u05d9\u05e2 \u05db\u05d1\u05e8 \u05e2\u05d5\u05de\u05d3/.test(commentary)'
              if old in s:
                  p.write_text(s.replace(old, new))

          p = Path('messages/he.json')
          s = p.read_text()
          if '"gate.9":' not in s:
              marker = '  "gate.10":'
              idx = s.find(marker)
              if idx == -1:
                  raise SystemExit('gate.10 anchor not found')
              s = s[:idx] + '  "gate.9": "רויאל ראמבל",\n' + s[idx:]
              p.write_text(s)
          PY

          rm -rf .patch-reconcile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: reconcile delta 76 and polish Royal Rumble match"
          git push origin HEAD:feature/gate-9-royal-rumble
