name: Finalize sync

on:
  push:
    branches: [sync/life-player-master-20260920]
    paths:
      - '.github/workflows/finalize-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final integration
        run: |
          python3 .sync/finalize.py
          python3 .sync/finalize-fix.py
      - name: Install
        run: npm ci
      - name: Build Player Master
        run: npm run players:master
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app lib tests package.json scripts docs content/generated
          git commit -m 'feat: synchronize LIFE, Kit V3 and central player master [validated]' || true
          git push origin HEAD:sync/life-player-master-20260920
