name: Royal Rumble polish

on:
  push:
    branches: [main]
    paths:
      - 'tools/royal-rumble-polish/**'
      - '.github/workflows/royal-rumble-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply polish
        run: |
          node tools/royal-rumble-polish/apply.mjs
          node <<'NODE'
          const fs = require('fs')
          for (const file of ['app/royal-rumble/RoyalRumbleRun.tsx', 'app/royal-rumble/RoyalRumbleLiveRun.tsx']) {
            let text = fs.readFileSync(file, 'utf8')
            text = text.replace(/\sdrop-shadow-\[[^\s"]+\]/g, '')
            fs.writeFileSync(file, text)
          }
          for (const file of ['app/royal-rumble/RoyalRumbleMode.tsx', 'app/royal-rumble/RoyalRumbleChallenge.tsx']) {
            let text = fs.readFileSync(file, 'utf8')
            text = text.replaceAll('min-h-[44px]', 'min-h-tap')
            fs.writeFileSync(file, text)
          }
          NODE
          rm -rf tools/royal-rumble-polish .github/workflows/royal-rumble-polish.yml

      - name: Install
        run: npm ci

      - name: Repository hygiene
        run: npm run repo:hygiene

      - name: Asset provenance
        run: npm run assets:provenance

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Royal Rumble: richer shirts and compact mobile layout"
          git push origin HEAD:main
