name: Finalize Gate 9 Clean

on:
  push:
    branches: [feature/gate-9-royal-rumble-clean]
    paths: [.gate9-finalize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-9-royal-rumble-clean
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Assemble clean Gate 9
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gate-9-royal-rumble:refs/remotes/origin/feature/gate-9-royal-rumble
          files=(
            app/royal-rumble/RoyalRumbleChallenge.tsx
            app/royal-rumble/RoyalRumbleMatchFX.tsx
            app/royal-rumble/RoyalRumbleRun.tsx
            app/royal-rumble/actions.ts
            app/royal-rumble/page.tsx
            lib/game/royal-rumble.ts
            lib/royal-rumble/i18n.ts
            tests/royal-rumble.test.ts
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/feature/gate-9-royal-rumble:$file" > "$file"
          done

          python - <<'PY'
          from pathlib import Path

          p = Path('lib/gates.ts')
          lines = p.read_text().splitlines()
          number_idx = next(i for i, line in enumerate(lines) if line.strip() == 'number: 9,')
          start = number_idx
          while start >= 0 and lines[start] != '  {':
              start -= 1
          end = number_idx
          while end < len(lines) and lines[end] != '  },':
              end += 1
          lines[start:end + 1] = [
              '  {',
              '    number: 9,',
              "    href: '/royal-rumble',",
              "    title: 'gate.9',",
              "    latin: 'ROYAL RUMBLE · HISTORICAL 5V5',",
              "    plate: 'rays',",
              "    stain: 'b',",
              '    seeded: true,',
              '    playable: true,',
              '  },',
          ]
          p.write_text('\n'.join(lines) + '\n')

          p = Path('messages/he.json')
          text = p.read_text()
          if '"gate.9"' not in text:
              anchor = '  "gate.8": "שחזור שער",\n'
              if anchor not in text:
                  raise SystemExit('gate.8 anchor not found')
              text = text.replace(anchor, anchor + '  "gate.9": "רויאל ראמבל",\n', 1)
              p.write_text(text)

          p = Path('lib/royal-rumble/i18n.ts')
          text = p.read_text()
          if 'goalFlashOurs:' not in text:
              anchor = "  matchDraw: 'נגמר. תיקו בזירה.',\n"
              if anchor not in text:
                  raise SystemExit('matchDraw i18n anchor not found')
              additions = (
                  "  goalFlashOurs: 'גול!',\n"
                  "  goalFlashTheirs: 'ספגנו.',\n"
                  "  goalFlashOursBody: 'הכדור בפנים. היציע מתפוצץ.',\n"
                  "  goalFlashTheirsBody: 'זה בפנים בצד שלנו. חוזרים מיד למרכז.',\n"
              )
              p.write_text(text.replace(anchor, anchor + additions, 1))

          p = Path('app/royal-rumble/RoyalRumbleMatchFX.tsx')
          text = p.read_text()
          if "import { t } from '@/lib/royal-rumble/i18n'" not in text:
              text = text.replace(
                  "import { useEffect, useRef, useState } from 'react'\n",
                  "import { useEffect, useRef, useState } from 'react'\n\nimport { t } from '@/lib/royal-rumble/i18n'\n",
                  1,
              )
          text = text.replace(
              "{flash.ours ? 'גול!' : 'ספגנו.'}",
              "{t(flash.ours ? 'goalFlashOurs' : 'goalFlashTheirs')}",
          )
          text = text.replace(
              "{flash.ours ? 'הכדור בפנים. היציע מתפוצץ.' : 'זה בפנים בצד שלנו. חוזרים מיד למרכז.'}",
              "{t(flash.ours ? 'goalFlashOursBody' : 'goalFlashTheirsBody')}",
          )
          p.write_text(text)

          p = Path('tests/archive.test.ts')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "describe('הקיר — שער 12 נפתח, ושער 9 בשיפוצים'" in line:
                  lines[i] = "describe('הקיר — שער 12 ושער 9 פתוחים', () => {"
                  break
          test_idx = next(i for i, line in enumerate(lines) if "it('hangs gate 9 with no door behind it" in line)
          block_start = test_idx
          while block_start > 0 and lines[block_start].strip() != '/**':
              block_start -= 1
          block_end = test_idx
          while block_end < len(lines) and lines[block_end] != '  })':
              block_end += 1
          replacement = [
              '  /** Gate 9 is now the seeded, playable Royal Rumble route. */',
              "  it('opens gate 9 as Royal Rumble and counts it as playable', () => {",
              "    expect(gate(9)?.href).toBe('/royal-rumble')",
              '    expect(gate(9)?.playable).toBe(true)',
              '    expect(gate(9)?.seeded).toBe(true)',
              '    expect(PLAYABLE_GATES.map((row) => row.number)).toContain(9)',
              '    expect(allGates().map((row) => row.number)).toContain(9)',
              "    expect(gateFor('/royal-rumble')?.number).toBe(9)",
              "    expect(gateSeeded('/royal-rumble')).toBe(true)",
              '    expect(GATES.filter((row) => !isOpen(row)).map((row) => row.number)).not.toContain(9)',
              '  })',
          ]
          lines[block_start:block_end + 1] = replacement
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install
        run: npm ci
      - name: Repository hygiene
        run: npm run repo:hygiene
      - name: Asset provenance
        run: npm run assets:provenance
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Dead ends — THE WORKER LIFE
        run: npm run life:deadends
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

      - name: Commit clean Gate 9
        shell: bash
        run: |
          set -euo pipefail
          rm -f .gate9-finalize .github/workflows/finalize-gate9-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: open Gate 9 Royal Rumble"
          git push origin HEAD:feature/gate-9-royal-rumble-clean
