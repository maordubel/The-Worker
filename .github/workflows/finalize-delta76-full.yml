name: Finalize Delta76 Full Merge

on:
  push:
    branches:
      - feature/delta76-full-merge
    paths:
      - .delta76-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/delta76-full-merge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Restore omitted Delta76 contracts
        shell: bash
        run: |
          set -euo pipefail
          python .delta76-fix/reconcile_store.py
          git apply --check .delta76-fix/messages.patch
          git apply .delta76-fix/messages.patch

      - name: Merge current main and keep production Gate 9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                app/royal-rumble/*|lib/game/royal-rumble.ts|lib/royal-rumble/i18n.ts|tests/royal-rumble.test.ts|lib/gates.ts|tests/archive.test.ts)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                messages/he.json)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file"
                  exit 1
                  ;;
              esac
            done
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          sed -i 's/"gate.9": "חדר ההלבשה"/"gate.9": "רויאל ראמבל"/' messages/he.json
          git add messages/he.json lib/polls/store.ts
          git diff --check

      - name: Install
        run: npm ci

      - name: Repository hygiene
        run: npm run repo:hygiene

      - name: Asset provenance
        run: npm run assets:provenance

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead ends — THE WORKER LIFE
        run: npm run life:deadends

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit full Delta76 integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .delta76-fix .delta76-finalize .github/workflows/finalize-delta76-full.yml
          git add -A
          git commit -m "feat: integrate Delta 76 gate upgrades"
          git push origin HEAD:feature/delta76-full-merge
