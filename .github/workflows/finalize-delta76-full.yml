name: Finalize Delta76 Full Merge

on:
  push:
    branches:
      - feature/delta76-full-merge
    paths:
      - .delta76-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/delta76-full-merge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Restore omitted Delta76 contracts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          p = Path('lib/polls/store.ts')
          text = p.read_text()

          def must_replace(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'poll store anchor missing: {label}')
              text = text.replace(old, new, 1)

          if "from './reasons'" not in text:
              must_replace(
                  "import { BALLOT, type Ballot, type Tally, type TallyRow } from './ballot'\n",
                  "import { BALLOT, type Ballot, type Tally, type TallyRow } from './ballot'\nimport { cleanReasons, isReasonOf, type Reasons } from './reasons'\n",
                  'reasons import',
              )

          if 'reasons(): Promise<Reasons>' not in text:
              must_replace(
                  "  seal(): Promise<void>\n}\n\nconst KEY",
                  "  seal(): Promise<void>\n  reasons(): Promise<Reasons>\n  saveReason(questionId: string, reason: string): Promise<void>\n}\n\nconst KEY",
                  'interface',
              )

          if 'REASON_KEY' not in text:
              must_replace(
                  "const SEAL_KEY = 'worker.ballot.sealed.v1'\n",
                  "const SEAL_KEY = 'worker.ballot.sealed.v1'\nconst REASON_KEY = 'worker.ballot.reasons.v1'\n",
                  'reason key',
              )

          text = text.replace(
              "for (const key of [KEY, SEAL_KEY]) window.localStorage.removeItem(key)",
              "for (const key of [KEY, SEAL_KEY, REASON_KEY]) window.localStorage.removeItem(key)",
              1,
          )

          if 'async reasons(): Promise<Reasons>' not in text:
              anchor = """  async seal(): Promise<void> {
    try {
      window.localStorage.setItem(SEAL_KEY, '1')
    } catch {
      // an unsealed slip locally is still a sealed slip for this session — the stamp
      // already printed on screen, and losing the flag on reload is a smaller failure
      // than throwing during the one action the whole document leads up to
    }
  }
}"""
              replacement = anchor[:-1] + """

  async reasons(): Promise<Reasons> {
    try {
      const raw = window.localStorage.getItem(REASON_KEY)
      if (!raw) return {}
      const parsed: unknown = JSON.parse(raw)
      if (typeof parsed !== 'object' || parsed === null) return {}
      return cleanReasons(parsed as Record<string, unknown>)
    } catch {
      return {}
    }
  }

  async saveReason(questionId: string, reason: string): Promise<void> {
    if (!isReasonOf(questionId, reason)) return
    try {
      const current = await this.reasons()
      const next: Reasons = { ...current }
      if (next[questionId] === reason) delete next[questionId]
      else next[questionId] = reason
      window.localStorage.setItem(REASON_KEY, JSON.stringify(next))
    } catch {
      // reasons are optional and must never break the ballot
    }
  }
}"""
              must_replace(anchor, replacement, 'local reasons')

          if 'return this.slip.reasons()' not in text:
              anchor = """  seal(): Promise<void> {
    return this.slip.seal()
  }
}"""
              replacement = anchor[:-1] + """

  reasons(): Promise<Reasons> {
    return this.slip.reasons()
  }

  saveReason(questionId: string, reason: string): Promise<void> {
    return this.slip.saveReason(questionId, reason)
  }
}"""
              must_replace(anchor, replacement, 'supabase reasons')

          p.write_text(text)
          PY

          git apply --check .delta76-fix/messages.patch
          git apply .delta76-fix/messages.patch

      - name: Merge current main and keep production Gate 9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                app/royal-rumble/*|lib/game/royal-rumble.ts|lib/royal-rumble/i18n.ts|tests/royal-rumble.test.ts|lib/gates.ts|tests/archive.test.ts)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                messages/he.json)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file"
                  exit 1
                  ;;
              esac
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path('messages/he.json')
          text = p.read_text()
          text = text.replace('"gate.9": "חדר ההלבשה"', '"gate.9": "רויאל ראמבל"')
          p.write_text(text)
          PY

          git add messages/he.json lib/polls/store.ts
          git diff --check

      - name: Install
        run: npm ci

      - name: Repository hygiene
        run: npm run repo:hygiene

      - name: Asset provenance
        run: npm run assets:provenance

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead ends — THE WORKER LIFE
        run: npm run life:deadends

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit full Delta76 integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .delta76-fix .delta76-finalize .github/workflows/finalize-delta76-full.yml
          git add -A
          git commit -m "feat: integrate Delta 76 gate upgrades"
          git push origin HEAD:feature/delta76-full-merge
